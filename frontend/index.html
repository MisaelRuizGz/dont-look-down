<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Don't Look Down — a minimalist typing speed practice tool. Type movie scripts or word lists, track your WPM, and see your history.">
    <title>Don't Look Down — Typing Practice</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Auth Modal: opened only via the Account button -->
    <div id="auth-modal" class="modal-overlay" style="display:none">
        <div class="modal">
            <button type="button" id="close-modal-btn" class="modal-close">&times;</button>

            <div id="modal-choice">
                <h2>Account</h2>
                <p>Sign in to save your history across devices</p>
                <button type="button" id="show-login-btn" class="modal-btn">Log In</button>
                <button type="button" id="show-signup-btn" class="modal-btn">Sign Up</button>
                <button type="button" id="guest-btn" class="modal-btn guest">Continue as Guest</button>
            </div>

            <div id="modal-login" style="display:none">
                <h2>Log In</h2>
                <input type="text" id="login-username" placeholder="Username" class="modal-input" autocomplete="username">
                <input type="password" id="login-password" placeholder="Password" class="modal-input" autocomplete="current-password">
                <p id="login-error" class="modal-error"></p>
                <button type="button" id="login-submit-btn" class="modal-btn">Log In</button>
                <button type="button" id="back-from-login" class="modal-btn guest">Back</button>
            </div>

            <div id="modal-signup" style="display:none">
                <h2>Sign Up</h2>
                <input type="text" id="signup-username" placeholder="Username" class="modal-input" autocomplete="username">
                <input type="password" id="signup-password" placeholder="Password" class="modal-input" autocomplete="new-password">
                <p id="signup-error" class="modal-error"></p>
                <button type="button" id="signup-submit-btn" class="modal-btn">Sign Up</button>
                <button type="button" id="back-from-signup" class="modal-btn guest">Back</button>
            </div>
        </div>
    </div>

    <div class="container">

        <div class="top-bar">
            <div class="title-section">
                <h1 class="header">Dont Look<br>Down</h1>
                <p class="description">typing practice tool</p>
            </div>

            <div class="options-section">
                <div class="buttons">
                    <button type="button" id="account-btn" class="option-btn">Account</button>
                    <span class="divider">|</span>
                    <button type="button" class="option-btn category-btn active" data-category="movies">movies</button>
                    <button type="button" class="option-btn category-btn" data-category="words">words</button>
                    <span class="divider">|</span>
                    <button type="button" class="option-btn time-btn active" data-time="30">30</button>
                    <button type="button" class="option-btn time-btn" data-time="60">60</button>
                    <button type="button" class="option-btn time-btn" data-time="120">120</button>
                    <button type="button" class="option-btn time-btn" data-time="180">180</button>
                </div>
                <p class="high-score" id="high-score-display">Guest's Highest Score: 0 wpm</p>
            </div>
        </div>

        <p id="timer-display" class="timer">0</p>

        <h2 id="sample-text" class="sample-text"></h2>

        <div style="text-align: center;">
            <label for="user-text" class="visually-hidden">Type the text above</label>
            <input type="text" id="user-text" name="user-text" placeholder="good luck" class="text-box" autocomplete="off">
        </div>

        <div style="text-align: center;">
            <button type="button" id="restart-btn" class="option-btn">restart</button>
        </div>

        <section class="history-section">
            <h3 class="history-title">History</h3>
            <div id="history-list" class="history-list"></div>
        </section>

    </div>

    <footer class="site-footer">
        <span class="option-btn">Version: 3.0.0</span>
        <a href="privacy.html" class="option-btn">Privacy Policy</a>
        <a href="terms.html" class="option-btn">Terms of Use</a>
        <a href="https://github.com/MisaelRuizGz/dont-look-down" class="option-btn" target="_blank" rel="noopener">GitHub</a>
        <span class="option-btn">&copy; 2026 Misael Ruiz-Gomez</span>
    </footer>

    <script src="script.js"></script>
</body>
</html>
